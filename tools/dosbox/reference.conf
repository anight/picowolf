#
# DOSBox settings for capturing the original DOS Wolfenstein 3D as a reference
# to compare picowolf against.  Nothing here is about playing the game well; it
# is about two runs producing the same bytes.
#
# core=normal with fixed cycles because the dynamic core and cycles=auto both
# make the emulated CPU speed depend on the host's load, and Wolf3D's frame
# pacing follows the CPU.  20000 is roughly a fast 386/slow 486, which is what
# the game was tuned for and fast enough that it is not the limit.
#
[sdl]
fullscreen=false
output=surface
autolock=false
waitonerror=true

[dosbox]
machine=vgaonly
captures=captures
memsize=16

[render]
frameskip=0
aspect=false
scaler=none

[cpu]
core=normal
cputype=auto
cycles=fixed 20000

#
# The mixer rate is the rate every capture comes out at: the WAV, and the OPL
# rendering inside it.  44100 so that resampling is never the reason two
# captures differ.
#
[mixer]
nosound=false
rate=44100
blocksize=1024
prebuffer=20

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
mixer=true
oplmode=auto
oplemu=default
oplrate=44100

[speaker]
pcspeaker=true
pcrate=44100
tandy=off
disney=false

[joystick]
joysticktype=none

[autoexec]
mount c /home/anight/picowolf/dosbox
c:
WOLF3D.EXE
